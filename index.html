<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List — Vue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .todo-item-enter {
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen py-8">
    <div id="app" class="max-w-2xl mx-auto px-4">
        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">Todo List</h1>
            <p class="text-white/80">Організуй свої задачі (Vue 3)</p>
        </header>

        <!-- Add Todo Form -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <form @submit.prevent="addTodo" class="flex gap-3">
                <input
                    v-model="newTodoText"
                    type="text"
                    placeholder="Додати нову задачу..."
                    class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                    required
                />
                <button
                    type="submit"
                    class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors duration-200 font-medium"
                >
                    Додати
                </button>
            </form>
        </div>

        <!-- Todo Stats -->
        <div class="flex justify-between items-center mb-4 text-sm text-white/90">
            <span>{{ todos.length }} задач</span>
            <span>{{ completedCount }} виконано</span>
        </div>

        <!-- Todo List -->
        <div class="space-y-3">
            <transition-group name="todo" tag="div" class="space-y-3">
                <div
                    v-for="todo in todos"
                    :key="todo.id"
                    class="todo-item-enter bg-white rounded-lg shadow-md p-4 flex items-center justify-between"
                    :class="{ 'opacity-60': todo.completed }"
                >
                    <div class="flex items-center gap-3 cursor-pointer" @click="toggleTodo(todo.id)">
                        <div
                            class="w-5 h-5 rounded border-2 flex items-center justify-center transition-colors duration-200"
                            :class="todo.completed ? 'bg-indigo-600 border-indigo-600' : 'border-gray-300 hover:border-indigo-400'"
                        >
                            <svg v-if="todo.completed" class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <span class="text-gray-800" :class="{ 'line-through text-gray-500': todo.completed }">{{ todo.text }}</span>
                    </div>
                    <button @click="removeTodo(todo.id)" class="text-gray-400 hover:text-red-600 p-1" title="Видалити">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                        </svg>
                    </button>
                </div>
            </transition-group>

            <!-- Empty State -->
            <div v-if="todos.length === 0" class="text-center py-12 text-white/70">
                <p class="text-lg">Задач поки немає. Додай першу!</p>
            </div>
        </div>

        <!-- Clear Completed Button -->
        <div class="mt-6 text-center">
            <button
                @click="clearCompleted"
                class="px-4 py-2 text-sm text-white/80 hover:text-white transition-colors duration-200 underline"
            >
                Очистити виконані
            </button>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, watch } = Vue;

        createApp({
            setup() {
                const todos = ref(JSON.parse(localStorage.getItem('todos')) || []);
                const newTodoText = ref('');

                const completedCount = computed(() =>
                    todos.value.filter(t => t.completed).length
                );

                // Зберігаємо в localStorage при кожній зміні
                watch(todos, (val) => {
                    localStorage.setItem('todos', JSON.stringify(val));
                }, { deep: true });

                function addTodo() {
                    const text = newTodoText.value.trim();
                    if (!text) return;

                    todos.value.unshift({
                        id: Date.now(),
                        text: text,
                        completed: false,
                        createdAt: new Date().toISOString()
                    });

                    newTodoText.value = ''; // Виправлення: очищуємо поле вводу
                }

                function toggleTodo(id) {
                    const todo = todos.value.find(t => t.id === id);
                    if (todo) todo.completed = !todo.completed;
                }

                function removeTodo(id) {
                    todos.value = todos.value.filter(t => t.id !== id);
                }

                function clearCompleted() {
                    todos.value = todos.value.filter(t => !t.completed);
                }

                return {
                    todos,
                    newTodoText,
                    completedCount,
                    addTodo,
                    toggleTodo,
                    removeTodo,
                    clearCompleted
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
